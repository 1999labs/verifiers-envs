[project]
name = "curators-eye"
version = "0.1.0"
description = "curators-eye: find the near-miss intruders in a curated collection and name its unstated organizing principle (single-turn)."
requires-python = ">=3.11"
dependencies = ["verifiers>=0.3.2.dev138", "datasets"]
tags = ["single-turn", "reasoning", "eval", "train"]
license = "MIT"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["curators_eye"]

[tool.verifiers.eval]
num_examples = 30
rollouts_per_example = 3

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
